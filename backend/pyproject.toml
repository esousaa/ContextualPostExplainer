[project]
name = "rapidcanvas-backend"
version = "0.1.0"
description = "Backend for the Contextual Post Explainer POC"
readme = "README.md"
authors = [
    { name = "Ederson Sousa", email = "ederson.vert@ons.org.br" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.0",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "trafilatura>=2.0.0",
    "uvicorn>=0.47.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "rich>=15.0.0",
    "ruff>=0.15.13",
    "typer>=0.25.1",
]
